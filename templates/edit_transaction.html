
{% extends "base.html" %}

{% block title %}Edit Transaction | Expense Tracker{% endblock %}

{% block content %}

<div class="form-page">
    <div class="content-card form-card">

        <h2>Edit Transaction</h2>
        <p class="text-muted">Update your transaction details.</p>

        <form action="/transactions/edit/{{ transaction.transaction_id }}"
              method="POST">

            <div class="mb-3">
                <label class="form-label">Transaction Type</label>
                <select name="type" class="form-select" required>
                    <option value="income"
                        {% if transaction.type == 'income' %}selected{% endif %}>
                        Income
                    </option>
                    <option value="expense"
                        {% if transaction.type == 'expense' %}selected{% endif %}>
                        Expense
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input type="number" name="amount"
                       class="form-control"
                       min="0.01" step="0.01"
                       value="{{ transaction.amount }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    {% for category in ['Food', 'Travel', 'Shopping', 'Education', 'Bills', 'Entertainment', 'Others'] %}
                    <option value="{{ category }}"
                        {% if transaction.category == category %}selected{% endif %}>
                        {{ category }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <input type="text" name="description"
                       class="form-control"
                       value="{{ transaction.description }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="date"
                       class="form-control"
                       value="{{ transaction.date }}"
                       required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Update Transaction
                </button>
                <a href="/transactions" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>

{% endblock %}
