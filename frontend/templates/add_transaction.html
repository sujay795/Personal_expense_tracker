
{% extends "base.html" %}

{% block title %}Add Transaction | Expense Tracker{% endblock %}

{% block content %}

<div class="form-page">
    <div class="content-card form-card">

        <h2>Add Transaction</h2>
        <p class="text-muted">Enter your income or expense details.</p>

        <form action="/transactions/add" method="POST">

            <div class="mb-3">
                <label class="form-label">Transaction Type</label>
                <select name="type" class="form-select" required>
                    <option value="">Select Type</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input type="number" name="amount"
                       class="form-control"
                       min="0.01" step="0.01"
                       placeholder="Enter amount"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <input type="text" name="description"
                       class="form-control"
                       placeholder="Enter description">
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="date"
                       class="form-control" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Save Transaction
                </button>
                <a href="/transactions" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>

{% endblock %}
